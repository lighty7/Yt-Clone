worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 500m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen 80;
        server_name yt-clone.duckdns.org _;

        # SSL will be handled by Tailscale Funnel
        # Uncomment below when you have SSL certificates
        # listen 443 ssl;
        # ssl_certificate /etc/nginx/ssl/fullchain.pem;
        # ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # Frontend static files
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Monitor dashboard
        location /status {
            proxy_pass http://monitor:3001/dashboard.html;
            proxy_set_header Host $host;
        }

        # Monitor API
        location /api/metrics {
            proxy_pass http://monitor:3001/api/metrics;
            proxy_set_header Host $host;
        }
        location /api/deploy {
            proxy_pass http://monitor:3001/api/deploy;
            proxy_set_header Host $host;
        }
        location /api/restart {
            proxy_pass http://monitor:3001/api/restart;
            proxy_set_header Host $host;
        }

        # Backend API
        location /api {
            proxy_pass http://backend:3000/api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Backend health check
        location /health {
            proxy_pass http://backend:3000/health;
            proxy_set_header Host $host;
        }

        # Uploads
        location /uploads {
            proxy_pass http://backend:3000/uploads;
            proxy_set_header Host $host;
        }

        # Root API redirect
        location = / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
        }
    }
}
